[tool.poetry]
name = "dpytools"
version = "0.12.0"
description = "Simple reusable Python resources for digital publishing"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "=3.13.*"
structlog = "^25.3.0"
jsonschema = "^4.23.0"
requests = "^2.32.4"
backoff = "^2.2.1"
boto3 = "^1.38.22"
email-validator = "^2.2.0"
pydantic = "^2.11.5"
pymongo = "^4.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.11"
isort = "^6.0.1"
pytest-cov = "^6.1.1"
moto = {extras = ["s3", "ses"], version = "^5.1.4"}
pytest-mock = "^3.14.0"
requests-mock = "^1.12.1"
mongomock = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    "docs/",
    ".md",
    ".zip",
    ".github/"
]

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = false
force-sort-within-sections = true
combine-as-imports = false
known-first-party = ["dpytools"]

# Keeping lint configuration
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
